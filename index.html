<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slicer — Split Images into Pieces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2e1dc;
      --text: #1a1918;
      --text-muted: #8a8882;
      --accent: #2d2d2d;
      --accent-light: #f0efeb;
      --success: #27ae60;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-lg: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeDown 0.5s ease both;
    }

    header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    header .logo-icon {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      padding: 2px;
    }

    header .logo-icon span {
      background: white;
      border-radius: 2px;
    }

    header h1 {
      font-family: 'DM Mono', monospace;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ── Main Container ── */
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* ── Upload State ── */
    #uploadSection {
      padding: 48px 32px;
      animation: fadeUp 0.4s ease both;
    }

    #uploadSection.hidden {
      display: none;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 56px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      background: var(--accent-light);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-zone h3 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .upload-zone p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ── Preview State ── */
    #previewSection {
      display: none;
    }

    #previewSection.active {
      display: block;
      animation: fadeUp 0.4s ease both;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }

    .preview-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .preview-filename {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
    }

    .preview-meta {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .btn-reset-small {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reset-small:hover {
      background: var(--accent-light);
      color: var(--text);
      border-color: transparent;
    }

    /* ── Preview Image ── */
    .preview-canvas-wrapper {
      overflow-x: auto;
      overflow-y: hidden;
      background: repeating-conic-gradient(#e8e7e3 0% 25%, #f0efe9 0% 50%) 50% / 14px 14px;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    #previewCanvas {
      max-width: 100%;
      max-height: 380px;
      display: block;
      box-shadow: var(--shadow-lg);
      background: white;
    }

    /* ── Controls Bar ── */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: #fafaf8;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .control-group label svg {
      opacity: 0.4;
    }

    .control-group input[type="number"] {
      width: 64px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      font-weight: 500;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      -moz-appearance: textfield;
      text-align: center;
    }

    .control-group input[type="number"]::-webkit-inner-spin-button,
    .control-group input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }

    .control-group input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45,45,45,0.08);
    }

    .controls-divider {
      width: 1px;
      height: 28px;
      background: var(--border);
    }

    .controls-spacer {
      flex: 1;
    }

    /* ── Buttons ── */
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: #1a1918;
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-reset {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .btn-reset:hover {
      background: var(--accent-light);
      color: var(--text);
      border-color: transparent;
    }

    .btn-download-all {
      background: var(--success);
      color: white;
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 0.9rem;
    }

    .btn-download-all:hover {
      background: #219a52;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(39,174,96,0.25);
    }

    /* ── Slices Grid ── */
    .slices-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: none;
    }

    .slices-card.active {
      display: block;
      animation: fadeUp 0.5s ease both;
    }

    .slices-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .slices-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slices-title::before {
      content: '';
      width: 3px;
      height: 13px;
      background: var(--accent);
      border-radius: 2px;
    }

    .slice-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .slices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .slice-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.4s ease both;
    }

    .slice-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .slice-item canvas {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .slice-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-top: 1px solid var(--border);
    }

    .slice-label span {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .slice-download {
      width: 26px;
      height: 26px;
      border: none;
      background: var(--accent-light);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      color: var(--text);
    }

    .slice-download:hover {
      background: var(--accent);
      color: white;
      transform: scale(1.08);
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body { padding: 24px 14px; }
      .controls-bar { flex-wrap: wrap; gap: 12px; }
      .controls-divider { display: none; }
      .controls-spacer { display: none; }
      .slices-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Selection ── */
    ::selection { background: rgba(45,45,45,0.12); }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">
        <span></span><span></span><span></span><span></span>
      </div>
      <h1>Slicer</h1>
    </div>
    <p>Split any image into uniform grid pieces — instantly</p>
  </header>

  <div class="container">

    <!-- Main Card -->
    <div class="card">

      <!-- Upload State -->
      <div id="uploadSection">
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept="image/*" />
          <div class="upload-icon">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="20" height="20" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <h3>Drop your image here</h3>
          <p>or click to browse — PNG, JPG, WEBP, GIF</p>
        </div>
      </div>

      <!-- Preview State -->
      <div id="previewSection">
        <div class="preview-header">
          <div class="preview-header-left">
            <span class="preview-filename" id="fileName">image.png</span>
            <div class="preview-meta">
              <span id="imgDims">—</span>
              <span id="imgSize">—</span>
            </div>
          </div>
          <button class="btn-reset-small" id="resetPreviewBtn">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            Start Over
          </button>
        </div>

        <div class="preview-canvas-wrapper">
          <canvas id="previewCanvas"></canvas>
        </div>

        <div class="controls-bar">
          <div class="control-group">
            <label>
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M12 3v18M3 12h18"/>
              </svg>
              Columns
            </label>
            <input type="number" id="colsInput" value="2" min="1" max="20" />
          </div>
          <div class="control-group">
            <label>
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M3 12h18M12 3v18"/>
              </svg>
              Rows
            </label>
            <input type="number" id="rowsInput" value="2" min="1" max="20" />
          </div>
          <div class="controls-divider"></div>
          <div class="controls-spacer"></div>
          <button class="btn btn-reset" id="resetBtn">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            Reset
          </button>
          <button class="btn btn-primary" id="sliceBtn">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 3h18M3 9h18M3 15h18M9 3v18M15 3v18"/>
            </svg>
            Slice Image
          </button>
        </div>
      </div>

    </div>

    <!-- Slices -->
    <div class="slices-card" id="slicesCard">
      <div class="slices-header">
        <div class="slices-title">Pieces</div>
        <span class="slice-count" id="sliceCount">0 pieces</span>
      </div>
      <div class="slices-grid" id="slicesGrid"></div>
      <div style="margin-top: 16px;">
        <button class="btn btn-download-all" id="downloadAllBtn" style="display:none;">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download All Pieces
        </button>
      </div>
    </div>

  </div>

  <script>
    // ── State ──
    let originalImage = null;
    let currentFileName = '';
    let sliceData = [];

    // ── Elements ──
    const uploadSection   = document.getElementById('uploadSection');
    const previewSection  = document.getElementById('previewSection');
    const uploadZone      = document.getElementById('uploadZone');
    const fileInput       = document.getElementById('fileInput');
    const fileNameEl      = document.getElementById('fileName');
    const colsInput       = document.getElementById('colsInput');
    const rowsInput       = document.getElementById('rowsInput');
    const sliceBtn        = document.getElementById('sliceBtn');
    const resetBtn         = document.getElementById('resetBtn');
    const resetPreviewBtn = document.getElementById('resetPreviewBtn');
    const previewCanvas   = document.getElementById('previewCanvas');
    const previewCtx      = previewCanvas.getContext('2d');
    const imgDims         = document.getElementById('imgDims');
    const imgSize         = document.getElementById('imgSize');
    const slicesCard      = document.getElementById('slicesCard');
    const slicesGrid      = document.getElementById('slicesGrid');
    const sliceCount      = document.getElementById('sliceCount');
    const downloadAllBtn  = document.getElementById('downloadAllBtn');

    // ── Drag & Drop ──
    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.classList.add('drag-over');
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('drag-over');
    });
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImage(file);
    });

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) loadImage(file);
    });

    // ── Load Image ──
    function loadImage(file) {
      currentFileName = file.name;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;

          // Update meta
          fileNameEl.textContent = file.name;
          imgDims.textContent = `${img.width} × ${img.height}px`;
          imgSize.textContent = formatSize(file.size);

          // Draw preview
          drawPreview();

          // Switch to preview state
          uploadSection.classList.add('hidden');
          previewSection.classList.add('active');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ── Draw Preview ──
    function drawPreview() {
      if (!originalImage) return;
      const img = originalImage;
      const maxW = 760, maxH = 380;
      let w = img.width, h = img.height;

      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }

      previewCanvas.width  = w;
      previewCanvas.height = h;
      previewCtx.clearRect(0, 0, w, h);
      previewCtx.drawImage(img, 0, 0, w, h);

      const cols = parseInt(colsInput.value) || 1;
      const rows = parseInt(rowsInput.value) || 1;
      drawGridOverlay(previewCtx, w, h, cols, rows);
    }

    function drawGridOverlay(ctx, w, h, cols, rows) {
      ctx.save();
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);

      const cellW = w / cols;
      const cellH = h / rows;

      for (let c = 1; c < cols; c++) {
        ctx.beginPath();
        ctx.moveTo(c * cellW + 0.5, 0);
        ctx.lineTo(c * cellW + 0.5, h);
        ctx.stroke();
      }
      for (let r = 1; r < rows; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * cellH + 0.5);
        ctx.lineTo(w, r * cellH + 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ── Slice ──
    sliceBtn.addEventListener('click', () => {
      if (!originalImage) return;

      const img = originalImage;
      const cols = Math.max(1, Math.min(20, parseInt(colsInput.value) || 1));
      const rows = Math.max(1, Math.min(20, parseInt(rowsInput.value) || 1));

      sliceData = [];
      slicesGrid.innerHTML = '';

      const cellW = Math.floor(img.width  / cols);
      const cellH = Math.floor(img.height / rows);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const canvas = document.createElement('canvas');
          canvas.width  = cellW;
          canvas.height = cellH;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, c * cellW, r * cellH, cellW, cellH, 0, 0, cellW, cellH);

          const label = `row-${r + 1}-col-${c + 1}`;
          const filename = `slice-${label}.png`;

          const item = document.createElement('div');
          item.className = 'slice-item';
          item.style.animationDelay = `${(r * cols + c) * 35}ms`;

          canvas.title = filename;
          item.appendChild(canvas);

          const labelEl = document.createElement('div');
          labelEl.className = 'slice-label';
          labelEl.innerHTML = `<span>${cellW}×${cellH}</span>`;

          const dlBtn = document.createElement('button');
          dlBtn.className = 'slice-download';
          dlBtn.title = 'Download';
          dlBtn.innerHTML = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
          dlBtn.addEventListener('click', () => downloadCanvas(canvas, filename));

          labelEl.appendChild(dlBtn);
          item.appendChild(labelEl);
          slicesGrid.appendChild(item);

          sliceData.push({ canvas, filename });
        }
      }

      sliceCount.textContent = `${sliceData.length} pieces`;
      slicesCard.classList.add('active');
      downloadAllBtn.style.display = 'flex';

      slicesCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // ── Download ──
    function downloadCanvas(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    downloadAllBtn.addEventListener('click', () => {
      sliceData.forEach(({ canvas, filename }, i) => {
        setTimeout(() => downloadCanvas(canvas, filename), i * 120);
      });
    });

    // ── Reset ──
    function resetAll() {
      originalImage = null;
      currentFileName = '';
      sliceData = [];
      fileInput.value = '';
      previewSection.classList.remove('active');
      slicesCard.classList.remove('active');
      slicesGrid.innerHTML = '';
      downloadAllBtn.style.display = 'none';
      uploadSection.classList.remove('hidden');
      colsInput.value = 2;
      rowsInput.value = 2;
    }

    resetBtn.addEventListener('click', resetAll);
    resetPreviewBtn.addEventListener('click', resetAll);

    // ── Live grid update ──
    colsInput.addEventListener('input', drawPreview);
    rowsInput.addEventListener('input', drawPreview);

    // ── Helpers ──
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
  </script>

</body>
</html>
